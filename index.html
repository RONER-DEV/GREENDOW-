<!DOCTYPE html>
<!--
  ============================================================
  GREENDOW* — Foggy Window Landing Page
  ============================================================
  TO CONFIGURE THIS PAGE:
    1. Open the <script> tag below.
    2. Find the block labeled "EDIT THESE TWO VALUES".
    3. Paste your cursor PNG URL into CURSOR_PNG_URL.
    4. Paste your Google Site URL into GOOGLE_SITE_URL.
  That's it — no other edits required.
  ============================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GREENDOW*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --brand-color: #1a3a2e;    /* deep elegant green for GREENDOW* */
    --page-bg: #f1ede2;        /* soft cream backdrop */
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--page-bg);
    font-family: "Playfair Display", Georgia, serif;
  }

  /* ─── BACKGROUND TEXT (sits behind the fog) ─── */
  .brand {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 700;
    font-size: clamp(48px, 12vw, 96px);
    color: var(--brand-color);
    letter-spacing: 0.02em;
    white-space: nowrap;
    z-index: 1;
    user-select: none;
    text-shadow: 0 2px 8px rgba(26, 58, 46, 0.08);
  }

  /* ─── FOG / BLUR OVERLAY ─── */
  .fog {
    position: absolute;
    inset: 0;
    z-index: 2;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background:
      radial-gradient(ellipse at 30% 40%, rgba(255,255,255,0.45) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(220,235,245,0.40) 0%, transparent 65%),
      linear-gradient(135deg,
        rgba(255,255,255,0.35) 0%,
        rgba(230,240,248,0.45) 50%,
        rgba(245,250,253,0.40) 100%);
    transition:
      backdrop-filter 1s cubic-bezier(0.4, 0, 0.2, 1),
      -webkit-backdrop-filter 1s cubic-bezier(0.4, 0, 0.2, 1),
      opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Cleared state — used after the button is clicked */
  .fog.cleared {
    backdrop-filter: blur(0px);
    -webkit-backdrop-filter: blur(0px);
    opacity: 0;
  }

  /* ─── DRIFTING DROPLETS (subtle condensation realism) ─── */
  .droplets {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
    transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .droplets.cleared { opacity: 0; }

  .droplet {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%,
      rgba(255,255,255,0.55) 0%,
      rgba(255,255,255,0.20) 40%,
      transparent 70%);
    filter: blur(1px);
    animation: drift linear infinite;
  }
  .droplet:nth-child(1)  { top: 10%; left: 15%; width: 60px; height: 60px; animation-duration: 28s; }
  .droplet:nth-child(2)  { top: 25%; left: 70%; width: 90px; height: 90px; animation-duration: 36s; animation-delay: -8s; }
  .droplet:nth-child(3)  { top: 55%; left: 25%; width: 50px; height: 50px; animation-duration: 24s; animation-delay: -5s; }
  .droplet:nth-child(4)  { top: 75%; left: 80%; width: 70px; height: 70px; animation-duration: 32s; animation-delay: -14s; }
  .droplet:nth-child(5)  { top: 40%; left: 50%; width: 110px; height: 110px; animation-duration: 40s; animation-delay: -20s; }
  .droplet:nth-child(6)  { top: 85%; left: 40%; width: 45px; height: 45px; animation-duration: 26s; animation-delay: -3s; }
  .droplet:nth-child(7)  { top: 5%;  left: 55%; width: 75px; height: 75px; animation-duration: 34s; animation-delay: -11s; }
  .droplet:nth-child(8)  { top: 65%; left: 10%; width: 55px; height: 55px; animation-duration: 30s; animation-delay: -17s; }

  @keyframes drift {
    0%   { transform: translate(0, 0)     scale(1);    opacity: 0.7; }
    50%  { transform: translate(20px, -15px) scale(1.05); opacity: 0.9; }
    100% { transform: translate(0, 0)     scale(1);    opacity: 0.7; }
  }

  /* ─── CLEAN WINDOW BUTTON ─── */
  .clean-btn {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    appearance: none;
    border: 1px solid rgba(255,255,255,0.55);
    padding: 16px 36px;
    border-radius: 12px;
    background: rgba(255,255,255,0.25);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow:
      0 8px 24px rgba(26, 58, 46, 0.12),
      inset 0 1px 0 rgba(255,255,255,0.4);
    font-family: "Playfair Display", Georgia, serif;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--brand-color);
    transition:
      transform 0.3s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.3s ease,
      background 0.3s ease,
      opacity 0.6s ease;
  }
  .clean-btn:hover {
    transform: translate(-50%, -50%) scale(1.05);
    background: rgba(255,255,255,0.4);
    box-shadow:
      0 12px 32px rgba(26, 58, 46, 0.18),
      0 0 24px rgba(255,255,255,0.5),
      inset 0 1px 0 rgba(255,255,255,0.6);
  }
  .clean-btn:active {
    transform: translate(-50%, -50%) scale(0.98);
  }
  .clean-btn.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="brand">GREENDOW*</div>

  <div class="droplets" id="droplets">
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
    <div class="droplet"></div>
  </div>

  <div class="fog" id="fog"></div>

  <button class="clean-btn" id="cleanBtn">Clean Window</button>

<script>
  // ====== EDIT THESE TWO VALUES ======
  const CURSOR_PNG_URL = "https://dochub.com/joconnor-83x4bw/4DeM0oWKm2gq2yzVXyLgP3/spraybottle-png-removebg-preview-png?gdiExists=1O9woUu7QIYWtXnKVT__30RivhHjZeiXP";
  const GOOGLE_SITE_URL = "https://sites.google.com/vancouvercollege.ca/greendow/home";
  // ===================================

  // Inject the custom cursor across the whole page + interactive elements.
  // Done in JS so you only edit ONE URL in the config block above.
  (function applyCursor() {
    const cursorValue = `url('${CURSOR_PNG_URL}'), auto`;
    document.body.style.cursor = cursorValue;

    const style = document.createElement('style');
    style.textContent = `
      html, body, button, a, *, *:hover {
        cursor: ${cursorValue} !important;
      }
    `;
    document.head.appendChild(style);
  })();

  // Wire up the "Clean Window" button: clear the fog, then redirect.
  const fog = document.getElementById('fog');
  const droplets = document.getElementById('droplets');
  const btn = document.getElementById('cleanBtn');

  btn.addEventListener('click', () => {
    // Trigger the fog-clearing animation
    fog.classList.add('cleared');
    droplets.classList.add('cleared');
    btn.classList.add('hidden');

    // After the ~1s wipe animation, redirect to the Google Site
    setTimeout(() => {
      window.location.href = GOOGLE_SITE_URL;
    }, 1100);
  });
</script>
</body>
</html>
