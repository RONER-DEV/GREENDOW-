<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Greendow — Clean the Window</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    /* Custom cursor — drop your cursor.png in the same folder as this file */
    cursor: url('cursor.png') 16 16, auto;
  }
  *, *:hover, a, button {
    cursor: url('cursor.png') 16 16, auto !important;
  }

  /* ─── SCENE ─── */
  .scene {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #f8f5ec;
  }

  /* ─── WINDOW FRAME ─── */
  .window {
    position: relative;
    width: min(80vw, 600px);
    height: min(70vh, 700px);
    background: #2a2a2a;
    border-radius: 12px;
    padding: 24px;
    box-shadow:
      0 30px 60px rgba(0,0,0,0.2),
      inset 0 2px 4px rgba(255,255,255,0.1);
  }

  /* The pane(s) — 2x2 grid for a classic window look */
  .panes {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 12px;
    position: relative;
  }
  .pane {
    position: relative;
    overflow: hidden;
    border-radius: 4px;
    /* The view "outside the window" — a bright sky */
    background: linear-gradient(180deg,
      #87ceeb 0%,
      #b6dff5 40%,
      #e8f4fc 70%,
      #fef6dd 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.25);
  }
  /* Sun */
  .pane::before {
    content: "";
    position: absolute;
    top: 20%;
    right: 18%;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff4b0 0%, #ffd966 60%, transparent 70%);
    filter: blur(2px);
    opacity: 0.9;
  }
  /* Distant hills */
  .pane::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 30%;
    background:
      radial-gradient(ellipse at 20% 100%, #7fb37f 0%, transparent 60%),
      radial-gradient(ellipse at 70% 100%, #5a9a5a 0%, transparent 65%),
      linear-gradient(180deg, transparent, #6ba86b);
  }

  /* ─── DIRT / SMUDGE LAYER ─── */
  .dirt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 30% 20% at 20% 30%, rgba(120,100,70,0.55), transparent 70%),
      radial-gradient(ellipse 25% 18% at 70% 25%, rgba(100,90,60,0.5), transparent 70%),
      radial-gradient(ellipse 20% 30% at 30% 70%, rgba(110,95,65,0.5), transparent 70%),
      radial-gradient(ellipse 35% 25% at 75% 75%, rgba(115,100,70,0.55), transparent 70%),
      radial-gradient(circle 40px at 50% 50%, rgba(130,110,80,0.45), transparent 70%),
      linear-gradient(135deg, rgba(180,165,130,0.35) 0%, rgba(150,135,100,0.45) 100%);
    mix-blend-mode: multiply;
    transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  /* Streaks layer for extra grime */
  .streaks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(105deg,
        rgba(80,70,50,0.12) 0px,
        rgba(80,70,50,0.12) 1px,
        transparent 1px,
        transparent 8px),
      repeating-linear-gradient(20deg,
        rgba(90,80,60,0.08) 0px,
        rgba(90,80,60,0.08) 1px,
        transparent 1px,
        transparent 14px);
    mix-blend-mode: multiply;
    transition: opacity 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* ─── CLEAN STATE: fade out the dirt ─── */
  .window.cleaning .dirt,
  .window.cleaning .streaks {
    opacity: 0;
  }

  /* ─── WIPE / SHINE that sweeps across when cleaning ─── */
  .shine {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(105deg,
      transparent 0%,
      transparent 35%,
      rgba(255,255,255,0.85) 45%,
      rgba(255,255,255,1) 50%,
      rgba(255,255,255,0.85) 55%,
      transparent 65%,
      transparent 100%);
    transform: translateX(-120%);
    opacity: 0;
    mix-blend-mode: screen;
  }
  .window.cleaning .shine {
    animation: wipe 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes wipe {
    0%   { transform: translateX(-120%); opacity: 0; }
    15%  { opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateX(120%);  opacity: 0; }
  }

  /* ─── SPRAY PARTICLES ─── */
  .spray-burst {
    position: absolute;
    top: 50%;
    left: 0;
    width: 0;
    height: 0;
    pointer-events: none;
    z-index: 10;
  }
  .droplet {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(200,255,220,0.9), rgba(140,210,170,0.4));
    opacity: 0;
  }
  .window.cleaning .droplet {
    animation: spray 1.2s ease-out forwards;
  }
  @keyframes spray {
    0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.2); opacity: 0; }
  }

  /* ─── BUTTON ─── */
  .controls {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 20;
  }
  .btn {
    appearance: none;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    background: #4a7c4e;
    color: #fff;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.02em;
    box-shadow:
      0 8px 20px rgba(74,124,78,0.35),
      inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }
  .btn:hover {
    background: #5a8d5e;
    transform: translateY(-1px);
    box-shadow:
      0 10px 24px rgba(74,124,78,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn:active {
    transform: translateY(1px);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: url('cursor.png') 16 16, auto !important;
  }
</style>
</head>
<body>
  <div class="scene">
    <div class="window" id="window">
      <div class="panes">
        <div class="pane">
          <div class="dirt"></div>
          <div class="streaks"></div>
          <div class="shine"></div>
        </div>
        <div class="pane">
          <div class="dirt"></div>
          <div class="streaks"></div>
          <div class="shine"></div>
        </div>
        <div class="pane">
          <div class="dirt"></div>
          <div class="streaks"></div>
          <div class="shine"></div>
        </div>
        <div class="pane">
          <div class="dirt"></div>
          <div class="streaks"></div>
          <div class="shine"></div>
        </div>
      </div>
      <div class="spray-burst" id="sprayBurst"></div>
    </div>

    <div class="controls">
      <button class="btn" id="cleanBtn">Spray &amp; Clean</button>
    </div>
  </div>

<script>
  const windowEl = document.getElementById('window');
  const btn = document.getElementById('cleanBtn');
  const burst = document.getElementById('sprayBurst');

  // Create droplet elements once, position them with CSS variables for spray direction
  function buildDroplets() {
    burst.innerHTML = '';
    const count = 24;
    const rect = windowEl.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'droplet';
      // Random spray angle & distance
      const angle = (Math.random() * 80) - 40; // ±40°
      const distance = 120 + Math.random() * (rect.width * 0.6);
      const rad = angle * Math.PI / 180;
      const dx = Math.cos(rad) * distance;
      const dy = Math.sin(rad) * distance;
      d.style.setProperty('--dx', `${dx}px`);
      d.style.setProperty('--dy', `${dy}px`);
      d.style.animationDelay = `${Math.random() * 0.2}s`;
      d.style.top = `${(Math.random() - 0.5) * 40}px`;
      burst.appendChild(d);
    }
  }

  btn.addEventListener('click', () => {
    if (windowEl.classList.contains('cleaning')) return;
    buildDroplets();
    windowEl.classList.add('cleaning');
    btn.disabled = true;
    btn.textContent = 'Cleaning…';

    // After the animation, reset so it can play again
    setTimeout(() => {
      btn.textContent = 'Clean Again';
      btn.disabled = false;
    }, 1800);
  });
</script>
</body>
</html>
